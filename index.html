<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งซ่อมออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* รวม CSS จากทุกไฟล์มาไว้ตรงนี้ */
        .hidden { display: none; }
    </style>
</head>
<body class="bg-slate-100 font-sans">

    <div id="page-content">
        <h2 class="text-center mt-20 text-slate-500">กำลังโหลดระบบ...</h2>
    </div>

    <nav class="fixed bottom-0 w-full bg-white border-t p-3 flex justify-around text-slate-500">
        <button onclick="showPage('form')"><i class="fa-solid fa-pen"></i></button>
        <button onclick="showPage('history')"><i class="fa-solid fa-clock"></i></button>
        <button onclick="showPage('analytics')"><i class="fa-solid fa-chart-pie"></i></button>
        <button onclick="showPage('technician')"><i class="fa-solid fa-user-gear"></i></button>
    </nav>

    <script>
        // 1. นำโค้ดฟังก์ชันการสลับหน้าจอมาวาง
        function showPage(page) {
            const content = document.getElementById('page-content');
            if(page === 'form') Page_Form();
            else if(page === 'history') Page_Tracking();
            else if(page === 'analytics') Page_Analytics();
            else if(page === 'technician') Page_Technician();
        }

        // 2. นำฟังก์ชัน Page_Form, Page_Tracking, Page_Analytics, Page_Technician 
        // จากไฟล์ที่คุณเคยมี มาวางต่อท้ายตรงนี้ให้หมด!

        // 3. อย่าลืมนำฟังก์ชัน fetch Supabase (submitRepair, getRepairs, ฯลฯ) มาวางด้วย!
        
        // เริ่มต้นให้แสดงหน้าแรก
        window.onload = () => showPage('form');
    </script>
</body>
</html>
