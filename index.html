// ==========================================
// ⚙️ SYSTEM LOGIC FOR FORM SUBMISSION
// ==========================================
var currentBase64 = "";
var isCompressing = false;

function compressAndPreview(event) {
  const file = event.target.files[0];
  if (file) {
    isCompressing = true;
    document.getElementById('uploadPlaceholder').classList.add('hidden');
    document.getElementById('imgPreview').classList.add('hidden');
    document.getElementById('loadingStatus').classList.remove('hidden');
    document.getElementById('btnSubmit').disabled = true;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.src = e.target.result;
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const max_width = 450; 
        const scale = max_width / img.width;
        canvas.width = max_width;
        canvas.height = img.height * scale;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        currentBase64 = canvas.toDataURL('image/jpeg', 0.4); 
        
        document.getElementById('imgPreview').src = currentBase64;
        document.getElementById('imgPreview').classList.remove('hidden');
        document.getElementById('loadingStatus').classList.add('hidden');
        document.getElementById('btnSubmit').disabled = false;
        isCompressing = false;
      }
    }
    reader.readAsDataURL(file);
  }
}

// 🔄 ฟังก์ชันกดยื่นฟอร์มที่ย้ายมายิงตรงหา Supabase แทน GAS ลัดขั้นตอน
async function handleFormSubmit(e) {
  e.preventDefault();
  
  if (isCompressing) {
    alert("⚠️ ระบบกำลังประมวลผลรูปภาพ กรุณารอสักครู่แล้วกดส่งอีกครั้งครับ");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-1"></i> กำลังส่งข้อมูลเข้า Supabase...`;

  };

  const result = await submitRepair(payload);
  
  if(result.success) {
    alert(result.message);
    document.getElementById('repairForm').reset();
    document.getElementById('imgPreview').classList.add('hidden');
    document.getElementById('uploadPlaceholder').classList.remove('hidden');
    currentBase64 = "";
  } else {
    alert("เกิดข้อผิดพลาดจากระบบ: " + result.message);
  }
  btn.disabled = false;
  btn.innerHTML = `ส่งข้อมูลใบแจ้งซ่อมเข้าระบบ <i class="fa-solid fa-paper-plane text-[10px] ml-1"></i>`;
