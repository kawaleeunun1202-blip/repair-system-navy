var currentBase64 = "";
var isCompressing = false;

function compressAndPreview(event) {
  const file = event.target.files[0];
  if (file) {
    isCompressing = true;
    document.getElementById('uploadPlaceholder').classList.add('hidden');
    document.getElementById('imgPreview').classList.add('hidden');
    document.getElementById('loadingStatus').classList.remove('hidden');
    document.getElementById('btnSubmit').disabled = true;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.src = e.target.result;
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const max_width = 450; 
        const scale = max_width / img.width;
        canvas.width = max_width;
        canvas.height = img.height * scale;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        currentBase64 = canvas.toDataURL('image/jpeg', 0.4); 
        
        document.getElementById('imgPreview').src = currentBase64;
        document.getElementById('imgPreview').classList.remove('hidden');
        document.getElementById('loadingStatus').classList.add('hidden');
        document.getElementById('btnSubmit').disabled = false;
        isCompressing = false;
      }
    }
    reader.readAsDataURL(file);
  }
}

// 🔄 ฟังก์ชันกดยื่นฟอร์มที่ย้ายมายิงตรงหา Supabase แทน GAS ลัดขั้นตอน
async function handleFormSubmit(e) {
  e.preventDefault();
  
  if (isCompressing) {
    alert("⚠️ ระบบกำลังประมวลผลรูปภาพ กรุณารอสักครู่แล้วกดส่งอีกครั้งครับ");
    return;
  }

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-1"></i> กำลังส่งข้อมูลเข้า Supabase...`;

  const payload = {
    urgency: document.querySelector('input[name="urgency"]:checked').value,
    subject: document.getElementById('subject').value,
    description: document.getElementById('description').value,
    location: document.getElementById('location').value,
    reporter_name: document.getElementById('reporter_name').value,
    phone: document.getElementById('phone').value,
    photo_before: currentBase64 || null
  };

  // เรียกใช้ฟังก์ชันที่ทำไว้ในเลย์เอาท์หลัก
  const result = await submitRepair(payload);
  
  if(result.success) {
    alert(result.message);
    document.getElementById('repairForm').reset();
    document.getElementById('imgPreview').classList.add('hidden');
    document.getElementById('uploadPlaceholder').classList.remove('hidden');
    currentBase64 = "";
  } else {
    alert("เกิดข้อผิดพลาดจากระบบ: " + result.message);
  }
  btn.disabled = false;
  btn.innerHTML = `ส่งข้อมูลใบแจ้งซ่อมเข้าระบบ <i class="fa-solid fa-paper-plane text-[10px] ml-1"></i>`;
}

if (typeof globalRepairs === 'undefined') { var globalRepairs = []; }
var activeFilter = "All";

// 🔄 เปลี่ยนมาใช้ฟังก์ชัน getRepairs ที่ยิง Fetch ตรงเข้า Supabase
async function fetchList() {
  const data = await getRepairs();
  globalRepairs = data || [];
  runFilter();
}

function runFilter() {
  const searchBar = document.getElementById('searchBar');
  if (!searchBar) return; // ป้องกันบั๊กกรณีสลับหน้าไปแล้วแต่ระบบยังประมวลผลอยู่
  
  const txt = searchBar.value.toLowerCase();
  const list = document.getElementById('repairList');
  
  const filtered = globalRepairs.filter(item => {
    const matchSearch = (item.subject && item.subject.toLowerCase().includes(txt)) || 
                        (item.reporter_name && item.reporter_name.toLowerCase().includes(txt)) || 
                        (item.job_number && item.job_number.toLowerCase().includes(txt));
    const matchStatus = activeFilter === 'All' || item.status === activeFilter;
    return matchSearch && matchStatus;
  });

  if(filtered.length === 0) {
    list.innerHTML = `
      <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 text-slate-400">
        <i class="fa-regular fa-folder-open text-2xl mb-2 text-slate-300"></i>
        <p class="text-xs font-medium">ไม่พบรายการข้อมูลที่ค้นหา</p>
      </div>`;
    return;

  list.innerHTML = filtered.map(item => {

    const origIndex = globalRepairs.findIndex(g => g.job_number === item.job_number);
    const lineBarColor = item.status === 'Completed' ? 'bg-emerald-500' : (item.status === 'In-Progress' ? 'bg-amber-500' : 'bg-slate-500');

    return `
      <div onclick="openInfoModal(${origIndex})" class="bg-white p-4 rounded-xl border border-slate-200 hover:border-slate-400 hover:shadow-md transition duration-200 cursor-pointer shadow-sm relative overflow-hidden">
        <div class="absolute left-0 top-0 bottom-0 w-1 ${lineBarColor}"></div>
        
        <div class="flex justify-between items-center mb-2 pl-1">
          <span class="text-[9px] font-bold border px-2 py-0.5 rounded-md ${uColor}">${item.urgency}</span>
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] font-black text-slate-400 tracking-wider">${item.job_number || 'Job-000'}</span>
            <span class="text-[9px] font-bold px-2 py-0.5 rounded-md ${sColor}">${item.status}</span>

        </div>
        <h4 class="font-bold text-slate-800 text-xs pl-1 mb-1 truncate">${item.subject}</h4>

if (typeof rawAnalyticsData === 'undefined') { var rawAnalyticsData = []; }

// 🔄 ดึงข้อมูลความเคลื่อนไหวจากส่วนกลางโดยยิงผ่าน Supabase Fetch
async function loadAnalytics() {
  const data = await getRepairs();
  rawAnalyticsData = data || [];
  calcAnalytics();
}

function calcAnalytics() {
  const filterEl = document.getElementById('monthFilter');
  if (!filterEl) return; // ป้องกันข้อผิดพลาดกรณีสลับหน้าจอไปมา
  
  const selectedMonth = filterEl.value;
  let filtered = rawAnalyticsData.filter(item => {
    if (selectedMonth === 'All') return true;
    
    // 🌟 รองรับตรวจสอบข้อมูลผ่านคอลัมน์ created_at ของ Supabase
    if (!item.created_at) return false;
    return new Date(item.created_at).getMonth() == selectedMonth;
  });

  const total = filtered.length;
  const pending = filtered.filter(i => i.status === 'Pending' || i.status === 'In-Progress').length;
  const completed = filtered.filter(i => i.status === 'Completed').length;
  const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

  document.getElementById('totalTasks').innerText = total;
  document.getElementById('pendingTasks').innerText = pending;
  document.getElementById('successRate').innerText = rate + '%';
}

  const file = input.files[0];

      document.getElementById('techImagePreviewContainer').classList.remove('hidden');

  }

  const result = await updateRepairStatus(payload);
  alert(result.message);
  closeEditModal();
  btn.disabled = false; btn.innerText = "บันทึกข้อมูล";
  loadTechJobs();
}

function openDeleteModal(jobId) {
  targetDeleteJobId = jobId;
  document.getElementById('deleteTargetText').innerText = jobId;
  document.getElementById('deleteModal').classList.remove('hidden');
}

function closeDeleteModal() { document.getElementById('deleteModal').classList.add('hidden'); }

// 🔄 ลบแถวข้อมูลผ่านฟังก์ชันฝั่งเลย์เอาท์หน้าบ้านที่ยิงตรงหา Supabase
async function executeDeleteJob() {
  const btn = document.getElementById('btnConfirmDelete');
  btn.disabled = true; btn.innerText = "กำลังลบ...";
  
  const result = await deleteRepairJob(targetDeleteJobId);
  alert(result.message);
  closeDeleteModal();
  btn.disabled = false; btn.innerText = "ใช่, ฉันต้องการลบ";
  loadTechJobs();
}

function exportToExcel() {
  if(techAllList.length === 0) { alert("ไม่มีข้อมูลสำหรับการดาวน์โหลด Excel"); return; }
  
  let csvContent = "\uFEFF";
  csvContent += "รหัสใบงาน,ระดับความด่วน,อุปกรณ์,อาการชำรุด,สถานที่ติดตั้ง,ผู้แจ้งเรื่อง,เบอร์ติดต่อ,ช่างผู้ซ่อม,สถานะ,หมายเหตุช่าง\n";
  
  techAllList.forEach(item => {
    let row = [
      `"${item.job_number || ''}"`,
      `"${item.urgency || ''}"`,
      `"${item.subject || ''}"`,
      `"${(item.description || '').replace(/\n/g, ' ')}"`,
      `"${item.location || ''}"`,
      `"${item.reporter_name || ''}"`,
      `"${item.phone || ''}"`,
      `"${item.tech_name || ''}"`,
      `"${item.status || ''}"`,
      `"${(item.tech_code || '').replace(/\n/g, ' ')}"`
    ].join(",");
    csvContent += row + "\n";
  });
  
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", "Repair_Tasks_Report_" + new Date().toISOString().slice(0,10) + ".csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
