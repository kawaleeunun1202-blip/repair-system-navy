<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งซ่อมออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans pb-20">

    <div id="page-content" class="p-4">
        <h2 class="text-center mt-20 text-slate-500">กำลังโหลดระบบ...</h2>
    </div>

    <nav class="fixed bottom-0 w-full bg-white border-t p-3 flex justify-around text-slate-500 shadow-lg">
        <button onclick="showPage('form')"><i class="fa-solid fa-pen"></i></button>
        <button onclick="showPage('history')"><i class="fa-solid fa-clock"></i></button>
        <button onclick="showPage('analytics')"><i class="fa-solid fa-chart-pie"></i></button>
        <button onclick="showPage('technician')"><i class="fa-solid fa-user-gear"></i></button>
    </nav>

    <script>
        // 1. ฟังก์ชันสลับหน้า
        function showPage(page) {
            const content = document.getElementById('page-content');
            if(page === 'form') Page_Form();
            else if(page === 'history') Page_Tracking();
            else if(page === 'analytics') Page_Analytics();
            else if(page === 'technician') Page_Technician();
        }

        // 2. นำโค้ดจากไฟล์ Page_Form.html, Page_Tracking.html, 
        // Page_Analytics.html และ Page_Technician.html มาวางต่อท้ายตรงนี้!
        
        window.onload = () => showPage('form');
    </script>
</body>
</html>
